name: Apply gameplay feedback patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-gameplay-feedback.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified feedback layer
        env:
          ENGINE_PATCH_B64: 
          CSS_PATCH_B64: 
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64, gzip, os

          def decode(name):
              return gzip.decompress(base64.b64decode(os.environ[name])).decode()

          engine = Path("engine.js")
          css = Path("qa-fixes.css")
          engine_text = engine.read_text()
          css_text = css.read_text()
          engine_marker = "/* Gameplay feedback layer: makes teaching choices, commitment, and progression legible"
          css_marker = "/* Gameplay feedback pass: visible learning, commitment, and progression. */"

          if engine_marker not in engine_text:
              engine.write_text(engine_text + decode("ENGINE_PATCH_B64"))
          if css_marker not in css_text:
              css.write_text(css_text + decode("CSS_PATCH_B64"))
          PYCODE
          node --check engine.js
          grep -q "Seal the Promise" engine.js
          grep -q "YOUR TEACHING PATH" engine.js
      - name: Commit and push
        run: |
          if git diff --quiet -- engine.js qa-fixes.css; then
            echo "Patch already present; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine.js qa-fixes.css
          git commit -m "Improve gameplay feedback and commitment"
          git pull --rebase origin main
          git push origin HEAD:main
