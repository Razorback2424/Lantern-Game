name: Wire intro rewrite

on:
  push:
    branches: [agent/intro-rewrite]
    paths:
      - .github/workflows/wire-intro-rewrite.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load the intro layer from the existing engine entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('engine.js')
          text=path.read_text()
          marker='/* Verb-first intro rewrite loader. */'
          loader='''

/* Verb-first intro rewrite loader. */
(function(){
  "use strict";
  if(document.querySelector('script[data-intro-rewrite]'))return;
  const style=document.createElement("link");
  style.rel="stylesheet";
  style.href="intro-rewrite.css";
  style.dataset.introRewrite="true";
  document.head.appendChild(style);
  const script=document.createElement("script");
  script.src="intro-rewrite.js";
  script.defer=true;
  script.dataset.introRewrite="true";
  document.head.appendChild(script);
})();
'''
          if marker not in text:
              path.write_text(text+loader)
          PY
          node --check engine.js
          grep -q 'intro-rewrite.js' engine.js
      - name: Commit branch update
        run: |
          if git diff --quiet -- engine.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine.js
          git commit -m "Wire verb-first intro rewrite"
          git push origin HEAD:agent/intro-rewrite
